<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Overview</title>
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <!-- 導航列 -->
  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">📚 Taigen 出勤系統</a>
      <div class="nav-links">
        <a href="daily-attendance.html" class="nav-link">每日點名</a>
        <a href="viewer.html" class="nav-link active">出勤總覽</a>
        <a href="payment.html" class="nav-link">請款系統</a>
        <a href="viewer-rh.html" class="nav-link">HR 報告</a>
      </div>
    </div>
  </nav>

  <div class="viewer-container">
    <header class="viewer-header">
      <h1>Attendance Overview</h1>
      <div class="controls">
        <div class="control-group">
          <label for="month-select">Month</label>
          <input type="month" id="month-select" class="month-input">
        </div>
        <div class="control-group">
          <label for="class-select-viewer">Class</label>
          <select id="class-select-viewer" class="class-select">
            <option value="all">All Classes</option>
          </select>
        </div>
        <div class="control-group">
          <button id="export-excel-btn" class="export-btn">Export Excel</button>
        </div>
      </div>
    </header>

    <main class="viewer-content" id="viewer-content">
      <div class="loading">Loading...</div>
    </main>
  </div>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
